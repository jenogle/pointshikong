async function login(){let j=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=j.access_token;localStorage.setItem('psk_access_token',token);after()}async function after(){let a=await req('/rest/v1/admin_users?select=user_id&limit=1');if(!a.length)return alert('無管理員權限');$('login').classList.add('hide');$('dash').classList.remove('hide');$('logout').classList.remove('hide');$('refresh').onclick=reload;$('search').oninput=renderRows;$('status').onchange=renderRows;$('pointSearch').oninput=renderPoints;$('pick').onclick=pickDate;$('createDates').onclick=createDates;$('addAdmin').onclick=addAdmin;reload()}
async function reload(){[rows,dates,parts,hist]=await Promise.all([req('/rest/v1/registrations?select=*&order=created_at.desc'),req('/rest/v1/event_dates?select=*&order=event_date.asc'),req('/rest/v1/participants?select=*&order=points.desc,email.asc'),req('/rest/v1/points_history?select=*&order=created_at.desc&limit=500')]);try{admins=await req('/rest/v1/rpc/admin_list_admins',{method:'POST',body:'{}'})}catch{admins=[]}$('total').textContent=rows.length;$('confirmed').textContent=rows.filter(x=>x.status==='confirmed').length;$('accounts').textContent=parts.length;$('due').textContent='NT$'+rows.reduce((a,b)=>a+(+b.registration_fee||200),0);$('got').textContent='NT$'+rows.reduce((a,b)=>a+(+b.paid_amount||0),0);renderDates();renderRows();renderEvents();renderPoints();renderRanks();renderAdmins()}
function renderDates(){$('dateList').innerHTML=dates.map(d=>`<div class="listrow"><div class="grow"><b>${d.event_date}</b><div class="muted">${FIX} · NT$${d.registration_fee} · ${d.is_active?'開放中':'已停用'}</div></div><button class="ghost tog" data-id="${d.id}" data-on="${d.is_active}">${d.is_active?'停用':'開放'}</button><button class="danger del" data-id="${d.id}">刪除</button></div>`).join('');document.querySelectorAll('.tog').forEach(b=>b.onclick=async()=>{await req('/rest/v1/event_dates?id=eq.'+b.dataset.id,{method:'PATCH',body:JSON.stringify({is_active:b.dataset.on!=='true'})});reload()});document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(confirm('確定刪除此場次？')){await req('/rest/v1/event_dates?id=eq.'+b.dataset.id,{method:'DELETE'});reload()}})}function renderRows(){let q=$('search').value.toLowerCase(),s=$('status').value,a=rows.filter(r=>(!s||r.status===s)&&(!q||[r.full_name,r.email,r.event_date].some(v=>String(v||'').toLowerCase().includes(q))));$('tbody').innerHTML=a.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString('zh-TW')}</td><td>${r.event_date}</td><td>${esc(r.full_name)}</td><td>${esc(r.email)}</td><td>NT$${r.registration_fee||200}</td><td><select class="pay" data-id="${r.id}" ${r.payment_method?'disabled':''}><option value="unpaid" ${r.payment_status==='unpaid'?'selected':''}>未付款</option><option value="paid" ${r.payment_status==='paid'?'selected':''}>已付款</option><option value="refunded" ${r.payment_status==='refunded'?'selected':''}>退款</option></select></td><td><select class="method" data-id="${r.id}"><option value="">—</option><option value="cash" ${r.payment_method==='cash'?'selected':''}>現金</option><option value="transfer" ${r.payment_method==='transfer'?'selected':''}>轉帳</option><option value="other" ${r.payment_method==='other'?'selected':''}>其他</option></select></td><td><input class="amt" data-id="${r.id}" type="number" value="${+r.paid_amount||0}" style="width:80px"></td><td>${statusSelect(r,'st')}</td></tr>`).join('');document.querySelectorAll('.method').forEach(x=>x.onchange=()=>savePay(x.dataset.id,true));document.querySelectorAll('.pay,.amt').forEach(x=>x.onchange=()=>savePay(x.dataset.id,false));document.querySelectorAll('.st').forEach(x=>x.onchange=async()=>{await req('/rest/v1/registrations?id=eq.'+x.dataset.id,{method:'PATCH',body:JSON.stringify({status:x.value})});reload()})}function statusSelect(r,c){return`<select class="${c}" data-id="${r.id}"><option value="new" ${r.status==='new'?'selected':''}>新報名</option><option value="contacted" ${r.status==='contacted'?'selected':''}>已聯繫</option><option value="confirmed" ${r.status==='confirmed'?'selected':''}>已確認</option><option value="waitlist" ${r.status==='waitlist'?'selected':''}>候補</option><option value="cancelled" ${r.status==='cancelled'?'selected':''}>取消</option></select>`}async function savePay(id,mchg){let p=[...document.querySelectorAll('.pay')].find(x=>x.dataset.id===id),m=[...document.querySelectorAll('.method')].find(x=>x.dataset.id===id),a=[...document.querySelectorAll('.amt')].find(x=>x.dataset.id===id),r=rows.find(x=>x.id===id),st=p.value;if(mchg&&m.value){st='paid';p.value='paid';p.disabled=true;if(!+a.value)a.value=r.registration_fee||200}if(mchg&&!m.value)p.disabled=false;await req('/rest/v1/registrations?id=eq.'+id,{method:'PATCH',body:JSON.stringify({payment_status:st,payment_method:m.value||null,paid_amount:+a.value||0,paid_at:st==='paid'?new Date().toISOString():null})});reload();toast('付款已更新 ✓')}
function renderEvents(){let all=[...new Set([...dates.map(d=>d.event_date),...rows.map(r=>r.event_date)])].sort();$('eventOps').innerHTML=all.map(d=>{let rr=rows.filter(r=>r.event_date===d),due=rr.reduce((a,b)=>a+(+b.registration_fee||200),0),got=rr.reduce((a,b)=>a+(+b.paid_amount||0),0);return`<div class="event"><div class="eventhead"><div><b>${d}</b><div class="muted">${rr.length} 人</div></div><button class="ghost evt">查看名單</button></div><div class="eventstats"><div>報名<b>${rr.length} 人</b></div><div>應收<b>NT$${due}</b></div><div>已收<b>NT$${got}</b></div><div>未收<b>NT$${Math.max(0,due-got)}</b></div></div><div class="detail"><div class="table"><table><thead><tr><th>姓名</th><th>Email</th><th>付款</th><th>方式</th><th>實收</th><th>狀態</th></tr></thead><tbody>${rr.map(r=>`<tr><td>${esc(r.full_name)}</td><td>${esc(r.email)}</td><td>${({unpaid:'未付款',paid:'已付款',refunded:'退款'}[r.payment_status]||'未付款')}</td><td>${({cash:'現金',transfer:'轉帳',other:'其他'}[r.payment_method]||'—')}</td><td>NT$${+r.paid_amount||0}</td><td>${statusSelect(r,'est')}</td></tr>`).join('')}</tbody></table></div></div></div>`}).join('');document.querySelectorAll('.evt').forEach(b=>b.onclick=()=>{let e=b.closest('.event');e.classList.toggle('open');b.textContent=e.classList.contains('open')?'收合名單':'查看名單'});document.querySelectorAll('.est').forEach(x=>x.onchange=async()=>{await req('/rest/v1/registrations?id=eq.'+x.dataset.id,{method:'PATCH',body:JSON.stringify({status:x.value})});reload();toast('參賽者狀態已更新 ✓')})}
function renderPoints(){let q=$('pointSearch').value.toLowerCase(),a=parts.filter(p=>!q||[p.email,p.full_name,p.nickname].some(v=>String(v||'').toLowerCase().includes(q)));$('pointList').innerHTML=a.map(p=>{let hh=hist.filter(h=>h.participant_email===p.email).slice(0,20);return`<div class="pointrow"><div><b>${esc(p.email)}</b><div class="muted">${esc(p.full_name||'')}${p.nickname?' · '+esc(p.nickname):''}</div></div><div class="controls"><button class="ghost minus" data-e="${p.email}">-1</button><input class="pts" data-e="${p.email}" type="number" value="${p.points}"><button class="ghost plus" data-e="${p.email}">+1</button><input class="note" data-e="${p.email}" placeholder="YYYY-MM-DD場次 第1名"><button class="primary save" data-e="${p.email}">儲存</button><button class="ghost histbtn" data-e="${p.email}">紀錄 ${hh.length}</button></div><div class="history" data-h="${p.email}">${hh.map(h=>`<div class="hist"><span>${new Date(h.created_at).toLocaleString('zh-TW')}</span><b>${h.change_amount>=0?'+':''}${h.change_amount}（${h.previous_points}→${h.new_points}）</b><span>${esc(h.note||'無標註')}</span></div>`).join('')}</div></div>`}).join('');document.querySelectorAll('.minus').forEach(b=>b.onclick=()=>adjust(b.dataset.e,-1));document.querySelectorAll('.plus').forEach(b=>b.onclick=()=>adjust(b.dataset.e,1));document.querySelectorAll('.save').forEach(b=>b.onclick=()=>savePts(b.dataset.e));document.querySelectorAll('.histbtn').forEach(b=>b.onclick=()=>document.querySelector('[data-h="'+CSS.escape(b.dataset.e)+'"]').classList.toggle('show'))}function pinput(e){return[...document.querySelectorAll('.pts')].find(x=>x.dataset.e===e)}function ninput(e){return[...document.querySelectorAll('.note')].find(x=>x.dataset.e===e)}function adjust(e,n){pinput(e).value=+pinput(e).value+n}async function savePts(e){await req('/rest/v1/rpc/admin_set_participant_points',{method:'POST',body:JSON.stringify({p_email:e,p_points:+pinput(e).value,p_note:ninput(e).value||null})});reload();toast('積分已儲存 ✓')}
function renderRanks(){let m={};rows.forEach(r=>{if(r.email&&r.status!=='cancelled'){let e=r.email.toLowerCase();m[e]=(m[e]||0)+1}});$('attendance').innerHTML=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([e,c],i)=>`<div class="rankrow"><b>#${i+1}</b><span>${esc(e)}</span><b>${c} 場</b><span>${(parts.find(p=>p.email===e)||{}).points||0} 分</span></div>`).join('');$('pointRank').innerHTML=[...parts].sort((a,b)=>b.points-a.points).map((p,i)=>`<div class="rankrow"><b>#${i+1}</b><span>${esc(p.email)}</span><b>${p.points} 分</b><span>${m[p.email]||0} 場</span></div>`).join('')}function renderAdmins(){$('adminList').innerHTML=admins.map(a=>`<div class="listrow"><div class="grow"><b>${esc(a.email)}</b></div><button class="danger rm" data-id="${a.user_id}">移除</button></div>`).join('');document.querySelectorAll('.rm').forEach(b=>b.onclick=async()=>{let ok=await req('/rest/v1/rpc/admin_remove_admin',{method:'POST',body:JSON.stringify({p_user_id:b.dataset.id})});if(!ok)alert('不能移除目前登入中的自己');reload()})}async function addAdmin(){let e=$('adminEmail').value.trim();if(!e)return;let ok=await req('/rest/v1/rpc/admin_add_admin_by_email',{method:'POST',body:JSON.stringify({p_email:e})});if(!ok)return alert('找不到這個 Auth 使用者');$('adminEmail').value='';reload()}function pickDate(){let d=$('newDate').value;if(!d)return;picked.add(d);$('newDate').value='';renderChips()}function renderChips(){$('chips').innerHTML=[...picked].sort().map(d=>`<span class="chip">${d} <button class="ghost unpick" data-d="${d}">×</button></span>`).join('');document.querySelectorAll('.unpick').forEach(b=>b.onclick=()=>{picked.delete(b.dataset.d);renderChips()})}async function createDates(){if(!picked.size)return alert('請先加入日期');for(let d of picked)try{await req('/rest/v1/event_dates',{method:'POST',body:JSON.stringify({event_date:d,label:FIX,is_active:true,registration_fee:200})})}catch{}picked.clear();renderChips();reload();toast('場次已新增 ✓')}</script></body></html>
