<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POINT SHIKONG｜設定新密碼</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8f5ef,#eee8de);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#111}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(480px,100%);background:#fffdf8;border:1px solid #ded8cc;border-radius:26px;padding:30px;box-shadow:0 18px 55px rgba(28,23,14,.09)}.brand{font-size:12px;font-weight:950;letter-spacing:.12em}.eyebrow{margin-top:28px;font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:900;color:#716c64}h1{font-size:34px;margin:8px 0}.muted{color:#706b63;line-height:1.65;font-size:14px}.field{margin:16px 0}label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}input{width:100%;padding:13px 14px;border:1px solid #d8d1c4;border-radius:13px;font:inherit;outline:none}input:focus{border-color:#111;box-shadow:0 0 0 4px rgba(17,17,15,.05)}button{width:100%;border:0;border-radius:13px;background:#111;color:#fff;padding:14px;font:inherit;font-weight:900;cursor:pointer}.msg{display:none;margin:14px 0;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:850}.msg.show{display:block}.msg.bad{background:#fff0f1;color:#b4232e}.msg.ok{background:#eaf7f0;color:#19734c}.back{display:inline-block;margin-top:18px;color:#555;text-decoration:none;font-size:13px;font-weight:850}</style></head><body><div class="wrap"><main class="card"><div class="brand">POINT SHIKONG</div><div class="eyebrow">Password Recovery</div><h1>設定新密碼</h1><p class="muted">請設定一組至少 8 碼的新密碼。完成後即可回管理後台登入。</p><div id="msg" class="msg"></div><div id="form"><div class="field"><label>新密碼</label><input id="p1" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>再次輸入新密碼</label><input id="p2" type="password" minlength="8" autocomplete="new-password"></div><button id="saveBtn">儲存新密碼</button></div><a class="back" href="/admin.html">← 回管理後台</a></main></div><script>
const U='https://bzgqlykqaqzolymnctkz.supabase.co',K='sb_publishable_sUEWU4fzZCrPcnuf3nQTuQ_0frTg7wC';const $=id=>document.getElementById(id);function show(m,bad=false){$('msg').textContent=m;$('msg').className='msg show '+(bad?'bad':'ok')}const h=new URLSearchParams(location.hash.replace(/^#/,''));let token=h.get('access_token')||'';if(h.get('error')){show(h.get('error_description')||'這個重設密碼連結已失效，請回管理後台重新寄送。',true);$('form').style.display='none'}else if(!token){show('找不到有效的密碼恢復資訊，請回管理後台重新寄送重設信。',true);$('form').style.display='none'}else{history.replaceState({},'',location.pathname)}$('saveBtn').onclick=async()=>{const a=$('p1').value,b=$('p2').value;if(a.length<8){show('新密碼至少需要 8 碼。',true);return}if(a!==b){show('兩次輸入的密碼不一致。',true);return}const btn=$('saveBtn');btn.disabled=true;btn.textContent='儲存中…';try{const r=await fetch(U+'/auth/v1/user',{method:'PUT',headers:{apikey:K,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:a})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.msg||'更新失敗');show('密碼已更新完成，正在回到管理後台…');setTimeout(()=>location.href='/admin.html',1200)}catch(e){show('密碼更新失敗：'+e.message,true)}finally{btn.disabled=false;btn.textContent='儲存新密碼'}};
</script></body></html>
