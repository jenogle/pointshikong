<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POINT SHIKONG｜管理後台</title><style>:root{--bg:#f3f0e9;--ink:#11110f;--muted:#6f6b63;--card:#fffdf8;--line:#ded8cc;--bad:#b4232e;--ok:#19734c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8f5ef,#eee8de);color:var(--ink);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}.wrap{max-width:1160px;margin:auto;padding:26px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:950;letter-spacing:.08em}.top a{color:#111;text-decoration:none;font-weight:850;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 55px rgba(28,23,14,.08)}.login{max-width:480px;margin:50px auto;padding:28px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:900;color:var(--muted)}h1{font-size:34px;margin:8px 0}.muted{color:var(--muted);line-height:1.6}.field{margin:16px 0}label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}input,select,button{font:inherit}input,select{width:100%;padding:13px 14px;border:1px solid #d8d1c4;border-radius:13px;background:#fff;outline:none}input:focus,select:focus{border-color:#111;box-shadow:0 0 0 4px rgba(17,17,15,.05)}button{border:0;border-radius:13px;padding:13px 16px;font-weight:900;cursor:pointer}.primary{background:#111;color:#fff;width:100%}.ghost{background:#fff;border:1px solid var(--line);color:#111}.linkBtn{background:transparent;padding:8px 0;color:#4f4b45;font-size:13px}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px}.msg{display:none;padding:12px 14px;border-radius:12px;margin:14px 0;font-size:13px;font-weight:850}.msg.show{display:block}.msg.bad{background:#fff0f1;color:var(--bad)}.msg.ok{background:#eaf7f0;color:var(--ok)}.hide{display:none!important}.adminHead{display:flex;justify-content:space-between;align-items:end;gap:14px}.adminHead h1{margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{padding:18px;background:#fff;border:1px solid var(--line);border-radius:18px}.stat b{display:block;font-size:30px}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:230px}.table{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{padding:12px;border-bottom:1px solid #eee8de;text-align:left;font-size:13px;vertical-align:top}th{font-size:11px;color:var(--muted);background:#fbfaf7}.sub{display:block;color:var(--muted);font-size:11px;margin-top:4px}.status{padding:7px 9px;border-radius:9px}.empty{text-align:center;color:var(--muted);padding:36px}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.adminHead{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.stats{grid-template-columns:1fr}.actions{align-items:stretch;flex-direction:column}.linkBtn{align-self:flex-start}}</style></head><body><div class="wrap"><div class="top"><div class="brand">POINT SHIKONG</div><a href="/">返回報名頁</a></div><section id="loginView" class="card login"><div class="eyebrow">Admin Access</div><h1>管理後台</h1><p class="muted">使用管理員帳號登入後，即可查看與管理所有報名資料。</p><div id="msg" class="msg"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="primary">登入管理後台</button><div class="actions"><button id="forgotBtn" class="linkBtn">忘記密碼？</button><span class="muted" style="font-size:12px">僅限管理員帳號</span></div></section><section id="dash" class="hide"><div class="adminHead"><div><div class="eyebrow">Registration Dashboard</div><h1>報名管理</h1><p id="who" class="muted"></p></div><button id="logoutBtn" class="ghost">登出</button></div><div class="stats"><div class="stat"><b id="total">0</b><span>總報名</span></div><div class="stat"><b id="confirmed">0</b><span>已確認</span></div><div class="stat"><b id="newCount">0</b><span>新報名</span></div><div class="stat"><b id="events">0</b><span>場次數</span></div></div><div class="toolbar"><input id="search" placeholder="搜尋姓名、暱稱、電話、Email、場次"><select id="statusFilter"><option value="">全部狀態</option><option value="new">新報名</option><option value="contacted">已聯繫</option><option value="confirmed">已確認</option><option value="waitlist">候補</option><option value="cancelled">取消</option></select><button id="refresh" class="ghost">重新整理</button><button id="csv" class="ghost">匯出 CSV</button></div><div class="table"><table><thead><tr><th>時間</th><th>場次</th><th>參賽者</th><th>聯絡方式</th><th>LINE</th><th>狀態</th><th>備註</th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty hide">目前沒有符合條件的報名資料</div></div></section></div><script>
const U='https://bzgqlykqaqzolymnctkz.supabase.co',K='sb_publishable_sUEWU4fzZCrPcnuf3nQTuQ_0frTg7wC';let token=localStorage.getItem('psk_access_token')||'',rows=[];const $=id=>document.getElementById(id);function show(m,bad=false){$('msg').textContent=m;$('msg').className='msg show '+(bad?'bad':'ok')}async function req(path,opt={}){const h=Object.assign({apikey:K,'Content-Type':'application/json'},opt.headers||{});if(token)h.Authorization='Bearer '+token;const r=await fetch(U+path,Object.assign({},opt,{headers:h}));let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.msg||j.message||j.error_description||j.error||('HTTP '+r.status));return j}async function login(){try{const j=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=j.access_token;localStorage.setItem('psk_access_token',token);await afterLogin(j.user)}catch(e){show(e.message==='Invalid login credentials'?'Email 或密碼不正確。若忘記密碼，請使用下方「忘記密碼」。':e.message,true)}}async function currentUser(){if(!token)return null;try{return await req('/auth/v1/user')}catch{localStorage.removeItem('psk_access_token');token='';return null}}async function isAdmin(){try{const j=await req('/rest/v1/admin_users?select=user_id&limit=1',{headers:{Accept:'application/json'}});return Array.isArray(j)&&j.length>0}catch{return false}}async function afterLogin(user){if(!await isAdmin()){show('此帳號沒有管理員權限。',true);return}$('who').textContent=user?.email||'';$('loginView').classList.add('hide');$('dash').classList.remove('hide');await load()}async function forgot(){const email=$('email').value.trim();if(!email){show('請先輸入管理員 Email。',true);return}try{const redirect=location.origin+'/reset-password.html';await req('/auth/v1/recover?redirect_to='+encodeURIComponent(redirect),{method:'POST',body:JSON.stringify({email})});show('密碼重設信已寄出。請開啟最新一封信，並在新頁面設定新密碼。')}catch(e){show('無法寄送重設信：'+e.message,true)}}async function load(){try{rows=await req('/rest/v1/registrations?select=*&order=created_at.desc',{headers:{Accept:'application/json'}});render();$('total').textContent=rows.length;$('confirmed').textContent=rows.filter(x=>x.status==='confirmed').length;$('newCount').textContent=rows.filter(x=>x.status==='new').length;$('events').textContent=new Set(rows.map(x=>x.event_date).filter(Boolean)).size}catch(e){alert('載入失敗：'+e.message)}}function esc(v){return String(v??'').replace(/[&<>\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[s]))}function filtered(){const q=$('search').value.trim().toLowerCase(),s=$('statusFilter').value;return rows.filter(r=>(!s||r.status===s)&&(!q||[r.full_name,r.nickname,r.phone,r.email,r.event_date].some(v=>String(v||'').toLowerCase().includes(q))))}function render(){const data=filtered();$('empty').classList.toggle('hide',data.length>0);$('tbody').innerHTML=data.map(r=>'<tr><td>'+esc(new Date(r.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}))+'</td><td>'+esc(r.event_date)+'</td><td><b>'+esc(r.full_name)+'</b><span class="sub">'+esc(r.nickname)+'</span></td><td>'+esc(r.phone)+'<span class="sub">'+esc(r.email||'—')+'</span></td><td>'+(r.joined_official_line?'已加入':'未加入')+'</td><td><select class="status" data-id="'+esc(r.id)+'"><option value="new" '+(r.status==='new'?'selected':'')+'>新報名</option><option value="contacted" '+(r.status==='contacted'?'selected':'')+'>已聯繫</option><option value="confirmed" '+(r.status==='confirmed'?'selected':'')+'>已確認</option><option value="waitlist" '+(r.status==='waitlist'?'selected':'')+'>候補</option><option value="cancelled" '+(r.status==='cancelled'?'selected':'')+'>取消</option></select></td><td>'+esc(r.form_data?.extra_note||r.notes||'—')+'</td></tr>').join('');document.querySelectorAll('tbody .status').forEach(s=>s.onchange=()=>changeStatus(s.dataset.id,s.value))}async function changeStatus(id,status){try{await req('/rest/v1/registrations?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status})});const r=rows.find(x=>x.id===id);if(r)r.status=status;$('confirmed').textContent=rows.filter(x=>x.status==='confirmed').length;$('newCount').textContent=rows.filter(x=>x.status==='new').length}catch(e){alert('更新失敗：'+e.message);load()}}function csv(){const data=filtered(),head=['報名時間','場次','實名','暱稱','電話','Email','官方LINE','狀態','備註'],vals=data.map(r=>[new Date(r.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}),r.event_date,r.full_name,r.nickname,r.phone,r.email||'',r.joined_official_line?'已加入':'未加入',r.status,r.form_data?.extra_note||r.notes||'']);const out='\uFEFF'+[head,...vals].map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv;charset=utf-8'}));a.download='pointshikong-registrations-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)}$('loginBtn').onclick=login;$('forgotBtn').onclick=forgot;$('refresh').onclick=load;$('search').oninput=render;$('statusFilter').onchange=render;$('csv').onclick=csv;$('logoutBtn').onclick=()=>{localStorage.removeItem('psk_access_token');location.reload()};(async()=>{const u=await currentUser();if(u)await afterLogin(u)})();
</script></body></html>
