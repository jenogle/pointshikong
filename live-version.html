<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POINT SHIKONG 報名</title><style>body{font-family:system-ui,"Microsoft JhengHei";margin:0;background:#f5f5f5;color:#111}main{max-width:1000px;margin:auto;padding:24px}section,.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:22px;margin:14px 0}h1{font-size:36px}label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px}button{padding:12px 16px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hide{display:none}.msg{padding:12px;border-radius:10px;margin:10px 0}.ok{background:#e8f8ef}.bad{background:#ffecef}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stats div{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px}.stats b{font-size:28px;display:block}.toolbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}.toolbar select{width:auto}.table{overflow:auto;background:#fff;border:1px solid #ddd;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}@media(max-width:700px){.row,.stats{grid-template-columns:1fr 1fr}main{padding:14px}}@media(max-width:480px){.row{grid-template-columns:1fr}}</style><main><div id="front"><section><b>POINT SHIKONG</b><h1>活動報名</h1><p>請填寫正確資料，送出後將直接進入主辦方報名系統。</p></section><div id="fm"></div><form id="f"><div class="row"><section><h2>活動資訊</h2><label>比賽日期／場次 *</label><input name="event_date" required><label>Email</label><input name="email" type="email"></section><section><h2>參賽者資料</h2><label>實名 *</label><input name="full_name" required><label>暱稱 *</label><input name="nickname" required><label>電話 *</label><input name="phone" required minlength="8"></section><section><h2>官方 LINE</h2><label>是否已加入官方 LINE？ *</label><select name="joined_official_line" required><option value="">請選擇</option><option value="true">已加入</option><option value="false">尚未加入</option></select><label>其他補充</label><textarea name="extra_note"></textarea></section><section><h2>個資同意</h2><label><input style="width:auto" type="checkbox" name="consent" required> 我同意本次活動報名所需之個人資料蒐集與使用。</label><button type="submit">送出報名</button></section></div></form></div><div id="admin" class="hide"><section id="login"><h1>管理後台</h1><div id="am"></div><form id="af"><label>Email</label><input id="ae" type="email" required><label>密碼</label><input id="ap" type="password" minlength="8" required><button type="submit">登入</button></form><button id="su" style="margin-top:8px;background:#555">首次建立帳號</button><div id="setup" class="hide"><label>首次管理員設定碼</label><input id="code"><button id="boot">設為管理員</button></div></section><div id="dash" class="hide"><section><h1>報名管理</h1><p id="who"></p><button id="out">登出</button></section><div class="stats"><div><b id="t">0</b>總報名</div><div><b id="c">0</b>已確認</div><div><b id="n">0</b>新報名</div><div><b id="e">0</b>場次數</div></div><div class="toolbar"><input id="q" placeholder="搜尋姓名、暱稱、電話、Email、場次"><select id="sf"><option value="">全部狀態</option><option value="new">新報名</option><option value="contacted">已聯繫</option><option value="confirmed">已確認</option><option value="waitlist">候補</option><option value="cancelled">取消</option></select><button id="csv">匯出 CSV</button></div><div class="table"><table><thead><tr><th>時間</th><th>場次</th><th>姓名</th><th>暱稱</th><th>電話</th><th>Email</th><th>LINE</th><th>狀態</th><th>備註</th></tr></thead><tbody id="tb"></tbody></table></div></div></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const U='https://bzgqlykqaqzolymnctkz.supabase.co',K='sb_publishable_sUEWU4fzZCrPcnuf3nQTuQ_0frTg7wC',s=createClient(U,K),$=x=>document.getElementById(x),adm=location.pathname.includes('/admin')||new URLSearchParams(location.search).has('admin');if(adm){$('front').classList.add('hide');$('admin').classList.remove('hide');init()}function m(id,x,b=false){$(id).innerHTML='<div class="msg '+(b?'bad':'ok')+'">'+x+'</div>'}if(!adm)$('f').onsubmit=async ev=>{ev.preventDefault();let d=new FormData(ev.target),p={event_date:d.get('event_date').trim(),email:d.get('email').trim()||null,full_name:d.get('full_name').trim(),nickname:d.get('nickname').trim(),phone:d.get('phone').trim(),joined_official_line:d.get('joined_official_line')==='true',consent_personal_data:d.get('consent')==='on',form_data:{extra_note:d.get('extra_note').trim()}};let{error}=await s.from('registrations').insert(p);if(error)m('fm','送出失敗，請檢查資料。',true);else{ev.target.reset();m('fm','報名成功！主辦方已收到資料。')}};let rows=[];async function init(){$('af').onsubmit=login;$('su').onclick=signup;$('boot').onclick=boot;$('out').onclick=async()=>{await s.auth.signOut();location.reload()};$('q').oninput=render;$('sf').onchange=render;$('csv').onclick=csv;let{data:{user}}=await s.auth.getUser();if(user)after(user)}async function login(ev){ev.preventDefault();let{data,error}=await s.auth.signInWithPassword({email:$('ae').value,password:$('ap').value});if(error)m('am',error.message,true);else after(data.user)}async function signup(){let{data,error}=await s.auth.signUp({email:$('ae').value,password:$('ap').value});if(error)m('am',error.message,true);else m('am',data.session?'帳號已建立。':'帳號已建立，請先完成 Email 驗證。')}async function after(u){$('who').textContent=u.email;let{data,error}=await s.from('admin_users').select('user_id').limit(1);if(error||!data.length){$('setup').classList.remove('hide');m('am','此帳號尚未取得管理員權限。',true);return}$('login').classList.add('hide');$('dash').classList.remove('hide');let r=await s.from('registrations').select('*').order('created_at',{ascending:false});rows=r.data||[];render();stats()}async function boot(){let{data:{session}}=await s.auth.getSession();let r=await fetch(U+'/functions/v1/bootstrap-admin',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token},body:JSON.stringify({setupCode:$('code').value})}),j=await r.json();if(!r.ok)m('am',j.error||'設定失敗',true);else location.reload()}function filt(){let q=$('q').value.toLowerCase(),f=$('sf').value;return rows.filter(r=>(!f||r.status===f)&&(!q||[r.full_name,r.nickname,r.phone,r.email,r.event_date].some(v=>String(v||'').toLowerCase().includes(q))))}function render(){$('tb').innerHTML=filt().map(r=>'<tr><td>'+new Date(r.created_at).toLocaleString('zh-TW')+'</td><td>'+r.event_date+'</td><td>'+r.full_name+'</td><td>'+r.nickname+'</td><td>'+r.phone+'</td><td>'+(r.email||'')+'</td><td>'+(r.joined_official_line?'已加入':'未加入')+'</td><td><select data-id="'+r.id+'"><option '+(r.status==='new'?'selected':'')+' value="new">新報名</option><option '+(r.status==='contacted'?'selected':'')+' value="contacted">已聯繫</option><option '+(r.status==='confirmed'?'selected':'')+' value="confirmed">已確認</option><option '+(r.status==='waitlist'?'selected':'')+' value="waitlist">候補</option><option '+(r.status==='cancelled'?'selected':'')+' value="cancelled">取消</option></select></td><td>'+((r.form_data||{}).extra_note||'')+'</td></tr>').join('');document.querySelectorAll('#tb select').forEach(x=>x.onchange=async()=>{await s.from('registrations').update({status:x.value}).eq('id',x.dataset.id);let r=rows.find(z=>z.id===x.dataset.id);r.status=x.value;stats()})}function stats(){$('t').textContent=rows.length;$('c').textContent=rows.filter(x=>x.status==='confirmed').length;$('n').textContent=rows.filter(x=>x.status==='new').length;$('e').textContent=new Set(rows.map(x=>x.event_date)).size}function csv(){let a=[['時間','場次','實名','暱稱','電話','Email','LINE','狀態','備註'],...filt().map(r=>[r.created_at,r.event_date,r.full_name,r.nickname,r.phone,r.email||'',r.joined_official_line?'已加入':'未加入',r.status,(r.form_data||{}).extra_note||''])],b='\uFEFF'+a.map(x=>x.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),u=URL.createObjectURL(new Blob([b],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download='pointshikong.csv';l.click()}</script>
